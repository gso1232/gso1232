name: Refresh profile cards

# Redraws the contribution graph and the numbers card from real data:
# every morning, on demand, and whenever the drawing scripts change.

"on":
  schedule:
    - cron: "17 4 * * *"   # 06:17 Cairo
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the last year of contributions
        run: python scripts/contrib.py gso1232
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the graph and the numbers card
        run: |
          python scripts/heatmap.py
          python scripts/stats.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contributions.svg stats.svg
          git diff --cached --quiet || { git commit -m "chore: refresh profile cards [skip ci]" && git push; }
